[project]
name = "report-studio"
version = "0.1.0"
description = "Informes interactivos desde datos (Talento Humano, Presidencia)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "jinja2>=3.1", "fastapi>=0.110", "uvicorn>=0.29", "qrcode>=7.4", "playwright>=1.40"]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "beautifulsoup4>=4.12", "lxml>=5"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
