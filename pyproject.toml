[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "report-studio"
version = "0.1.0"
description = "Informes interactivos desde datos (Talento Humano, Presidencia)"
requires-python = ">=3.10"
dependencies = ["pydantic>=2.6", "jinja2>=3.1", "fastapi>=0.110", "uvicorn>=0.29", "qrcode>=7.4", "python-multipart>=0.0.9", "playwright>=1.40"]

[project.optional-dependencies]
ingest = ["pdfplumber>=0.11", "python-docx>=1.1", "python-pptx>=0.6.23", "openpyxl>=3.1", "pytesseract>=0.3", "pypdfium2>=4", "httpx>=0.27", "beautifulsoup4>=4.12", "lxml>=5"]
dev = ["pytest>=8", "httpx>=0.27", "beautifulsoup4>=4.12", "lxml>=5"]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.setuptools]
packages = ["app"]
package-dir = {"app" = "backend/app"}

[tool.setuptools.package-data]
app = ["templates/*.html"]
